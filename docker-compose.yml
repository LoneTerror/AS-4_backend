version: '3.8'

services:
  # 1. The Auth Microservice
  auth-service:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: rnr-auth
    ports:
      - "8001:8001"
    env_file:
      - .env
    command: uvicorn src.auth.main:app --host 0.0.0.0 --port 8001 --reload
    depends_on:
      - redis

  # 2. The Employees Microservice
  employees-service:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: rnr-employees
    ports:
      - "8003:8003"
    env_file:
      - .env
    command: uvicorn src.employees.main:app --host 0.0.0.0 --port 8003 --reload
    depends_on:
      - redis

  # 3. The Analytics Microservice (New)
  analytics-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rnr-analytics
    ports:
      - "8008:8008"
    env_file:
      - .env
    environment:
      # Overriding Redis and internal URLs for Docker networking
      - REDIS_URL=redis://redis:6379/0
      - AUTH_SERVICE_URL=http://auth-service:8001
      - EMPLOYEES_SERVICE_URL=http://employees-service:8003
    depends_on:
      - redis
      - auth-service
      - employees-service
    command: uvicorn src.analytics.main:app --host 0.0.0.0 --port 8008 --reload

  # 4. Redis (Event Stream & Caching)
  redis:
    image: redis:7-alpine
    container_name: rnr-redis
    ports:
      - "6379:6379"
    restart: always

networks:
  default:
    name: rnr-network