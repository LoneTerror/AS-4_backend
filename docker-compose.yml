version: '3.8'

services:
  # 1. The Auth Microservice
  auth-service:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: rnr-auth
    ports:
      - "8001:8001"
    env_file:
      - .env
    command: uvicorn src.auth.main:app --host 0.0.0.0 --port 8001 --reload
    depends_on:
      - redis

  # 2. The Employees Microservice
  employees-service:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: rnr-employees
    ports:
      - "8003:8003" # Matches your src.employees.main port
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/0
      # OTEL_EXPORTER_OTLP_ENDPOINT can be added here if using tracing
    depends_on:
      - redis
    # Using uvicorn on 8003 as defined in your main.py
    command: uvicorn src.employees.main:app --host 0.0.0.0 --port 8003 --reload

  # 3. Redis (Required for Employee's APScheduler and Workers)
  redis:
    image: redis:7-alpine
    container_name: rnr-redis
    ports:
      - "6379:6379"
    restart: always

networks:
  default:
    name: rnr-network