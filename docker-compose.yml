version: '3.8'

services:
  # 1. The Auth Microservice
  auth-service:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: rnr-auth
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=${DATABASE_URL}
    # This overrides the Dockerfile CMD to boot ONLY the Auth service
    command: uvicorn src.auth.main:app --host 0.0.0.0 --port 8001 --reload

  # 2. The Employees Microservice
  employees-service:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: rnr-employees
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=${DATABASE_URL}
    # This boots ONLY the Employees service
    command: uvicorn src.employees.main:app --host 0.0.0.0 --port 8002 --reload

  # 3. Redis (for your event consumers like Wallet)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"