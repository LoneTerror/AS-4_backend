[project]
name = "your-app"
version = "0.1.0"
description = "FastAPI application with Prisma ORM and PostgreSQL"
requires-python = ">=3.10,<3.14"

dependencies = [
    # FastAPI and ASGI server
    "fastapi>=0.111.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "gunicorn>=22.0.0,<24.0.0",

    # Pydantic
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",
    "pydantic[email]",
    "email-validator>=2.1.0,<3.0.0",

    # Prisma ORM
    "prisma>=0.13.0,<1.0.0",

    # Database
    "asyncpg>=0.29.0,<1.0.0",
    "openpyxl>=3.1.0,<4.0.0",

    # HTTP client
    "httpx>=0.27.0,<1.0.0",

    # Security
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "bcrypt>=4.0.0,<5.0.0",
    "python-multipart>=0.0.12,<1.0.0",

    # Environment & config
    "python-dotenv>=1.0.0,<2.0.0",

    # Date utilities
    "python-dateutil>=2.9.0,<3.0.0",

    # Email
    "aiosmtplib>=3.0.0,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-mock>=3.12.0,<4.0.0",
    "pytest-cov>=5.0.0,<7.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "scripts*"]

# ✅ SINGLE merged block — no duplicates
[tool.pytest.ini_options]
asyncio_mode   = "auto"
testpaths      = ["."]
filterwarnings = ["ignore::PendingDeprecationWarning"]
