[unix_http_server]
file=/tmp/supervisor.sock
chmod=0777

[supervisord]
nodaemon=true
logfile=/app/supervisord.log
pidfile=/tmp/supervisord.pid
# Global environment variables
environment=PYTHONPATH="/app",PRISMA_PY_BINARIES_PATH="/app/prisma_binaries"

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:auth]
command=/app/venv/bin/gunicorn src.auth.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8001 --workers 1
directory=/app
autostart=true
autorestart=true
# Explicitly injecting variables here to ensure Gunicorn workers see them
environment=PYTHONPATH="/app",PRISMA_PY_BINARIES_PATH="/app/prisma_binaries"
stderr_logfile=/app/auth.err.log
stdout_logfile=/app/auth.out.log

