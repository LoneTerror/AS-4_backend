[unix_http_server]
file=/tmp/supervisor.sock
chmod=0777

[supervisord]
nodaemon=true
logfile=/app/supervisord.log
pidfile=/tmp/supervisord.pid

; ---- GLOBAL ENVIRONMENT (CRITICAL FOR PRISMA) ----
environment=PYTHONPATH="/app",\
PRISMA_PY_BINARIES_PATH="/app/prisma_binaries",\
PRISMA_HOME="/app/.prisma",\
XDG_CACHE_HOME="/app/.cache"

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock


; =====================================================
; AUTH SERVICE
; =====================================================
[program:auth]
command=/app/venv/bin/gunicorn src.auth.main:app \
        -k uvicorn.workers.UvicornWorker \
        --bind 0.0.0.0:8001 \
        --workers 1 \
        --timeout 60 \
        --graceful-timeout 30
directory=/app
autostart=true
autorestart=true
startsecs=5
stderr_logfile=/app/auth.err.log
stdout_logfile=/app/auth.out.log


