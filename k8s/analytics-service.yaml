apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      containers:
      - name: analytics-service
        image: mrmonster786/rnr-backend-base:latest
        command: ["uvicorn", "src.analytics.main:app", "--host", "0.0.0.0", "--port", "8008", "--reload"]
        ports:
        - containerPort: 8008
        envFrom:
        - secretRef:
            name: rnr-secrets
        env:
        - name: REDIS_URL
          value: "redis://redis:6379/0"
        - name: AUTH_SERVICE_URL
          value: "http://auth-service:8001"
        - name: EMPLOYEES_SERVICE_URL
          value: "http://employees-service:8003"
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
spec:
  selector:
    app: analytics-service
  ports:
    - protocol: TCP
      port: 8008
      targetPort: 8008