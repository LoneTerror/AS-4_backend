apiVersion: apps/v1
kind: Deployment
metadata:
  name: roles-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: roles-service
  template:
    metadata:
      labels:
        app: roles-service
    spec:
      containers:
      - name: roles-container
        image: 192.168.116.51:30500/rnr-backend-base:latest 
        imagePullPolicy: Always
        # Match your local run.py entry point
        args: ["python", "-m", "uvicorn", "src.roles.main:app", "--host", "0.0.0.0", "--port", "8002"]
        ports:
        - containerPort: 8002
        envFrom:
        - secretRef:
            name: rnr-secrets
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: roles-service
spec:
  selector:
    app: roles-service
  ports:
    - protocol: TCP
      port: 8002
      targetPort: 8002