apiVersion: apps/v1
kind: Deployment
metadata:
  name: employees-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: employees-service
  template:
    metadata:
      labels:
        app: employees-service
    spec:
      containers:
      - name: employees-container
        image: 192.168.116.51:30500/rnr-backend-base:latest 
        imagePullPolicy: Always
        args: ["python", "-m", "uvicorn", "src.employees.main:app", "--host", "0.0.0.0", "--port", "8003"]
        ports:
        - containerPort: 8003
        envFrom:
        - secretRef:
            name: rnr-secrets
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: employees-service
spec:
  selector:
    app: employees-service
  ports:
    - protocol: TCP
      port: 8003
      targetPort: 8003