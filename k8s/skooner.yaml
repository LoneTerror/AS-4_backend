apiVersion: apps/v1
kind: Deployment
metadata:
  name: skooner
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: skooner
  template:
    metadata:
      labels:
        k8s-app: skooner
    spec:
      containers:
      - name: skooner
        image: ghcr.io/skooner-k8s/skooner:stable
        env:
        # --- CRITICAL: Tell Skooner it is living at /skooner ---
        - name: BASE_PATH
          value: "/skooner"
        ports:
        - containerPort: 4654
        livenessProbe:
          httpGet:
            scheme: HTTP
            # Use /skooner/ for the health check path
            path: /skooner/
            port: 4654
          initialDelaySeconds: 30
          timeoutSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: skooner
spec:
  ports:
  - port: 4654
    targetPort: 4654
  selector:
    k8s-app: skooner