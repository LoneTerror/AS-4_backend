apiVersion: apps/v1
kind: Deployment
metadata:
  name: recognition-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recognition-service
  template:
    metadata:
      labels:
        app: recognition-service
    spec:
      containers:
      - name: recognition-service
        image: mrmonster786/rnr-backend-base:latest
        command: ["uvicorn", "src.recognition.main:app", "--host", "0.0.0.0", "--port", "8005", "--reload"]
        ports:
        - containerPort: 8005
        envFrom:
        - secretRef:
            name: rnr-secrets
        env:
        - name: REDIS_URL
          value: "redis://redis:6379/0"
        - name: AUTH_SERVICE_URL
          value: "http://auth-service:8001/v1/auth/validate"
---
apiVersion: v1
kind: Service
metadata:
  name: recognition-service
spec:
  selector:
    app: recognition-service
  ports:
    - protocol: TCP
      port: 8005
      targetPort: 8005