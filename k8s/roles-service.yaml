apiVersion: apps/v1
kind: Deployment
metadata:
  name: roles-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: roles-service
  template:
    metadata:
      labels:
        app: roles-service
    spec:
      containers:
      - name: roles-service
        image: mrmonster786/rnr-backend-base:latest
        command: ["uvicorn", "src.roles.main:app", "--host", "0.0.0.0", "--port", "8002", "--reload"]
        ports:
        - containerPort: 8002
        envFrom:
        - secretRef:
            name: rnr-secrets
        env:
        - name: REDIS_URL
          value: "redis://redis:6379/0"
        - name: DATABASE_URL
          value: "postgresql://user:password@rnr-db:5432/rnr_db?schema=public"
---
apiVersion: v1
kind: Service
metadata:
  name: roles-service
spec:
  selector:
    app: roles-service
  ports:
    - protocol: TCP
      port: 8002
      targetPort: 8002