apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rnr-master-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/enable-cors: "true"
    
    # [FIX] Change this to a single origin or use the snippet below for multiple
    nginx.ingress.kubernetes.io/cors-allow-origin: "http://localhost:3000" 
    
    # [CRITICAL] Since you use 'Authorization' headers, this MUST be true
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    
    nginx.ingress.kubernetes.io/cors-allow-methods: "PUT, GET, POST, OPTIONS, DELETE"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization,X-Request-ID"

    # [THE MAGIC FIX] This snippet handles the preflight 'OPTIONS' request manually
    # It checks if the origin is one of yours and reflects it back.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      set $cors_origin "";
      if ($http_origin ~* (http://api.rnr.local|http://localhost:3000)) {
          set $cors_origin $http_origin;
      }

      if ($request_method = 'OPTIONS') {
          add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
          add_header 'Access-Control-Allow-Credentials' 'true' always;
          add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
          add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization,X-Request-ID' always;
          add_header 'Content-Length' 0;
          add_header 'Content-Type' 'text/plain; charset=utf-8';
          return 204;
      }
spec:
  ingressClassName: nginx
  rules:
  - host: api.rnr.local
    http:
      paths:
      - path: /v1/auth
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 8001

      - path: /v1/roles
        pathType: Prefix
        backend:
          service:
            name: roles-service
            port:
              number: 8002

      - path: /v1/employees
        pathType: Prefix
        backend:
          service:
            name: employees-service
            port:
              number: 8003
      - path: /v1/wallets
        pathType: Prefix
        backend:
          service:
            name: wallet-service
            port:
              number: 8004
      - path: /v1/recognitions
        pathType: Prefix
        backend:
          service:
            name: recognition-service
            port:
              number: 8005

      - path: /v1/rewards
        pathType: Prefix
        backend:
          service:
            name: rewards-service
            port:
              number: 8006

      - path: /v1/organizations
        pathType: Prefix
        backend:
          service:
            name: organization-service
            port:
              number: 8007

      - path: /v1/analytics
        pathType: Prefix
        backend:
          service:
            name: analytics-service
            port:
              number: 8008
      