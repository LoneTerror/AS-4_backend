apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aabhar-master-ingress
  namespace: default
  annotations:
    # --- AWS ALB Core Configuration ---
    # Creates an internet-facing Load Balancer
    alb.ingress.kubernetes.io/scheme: internet-facing
    # Routes traffic directly to Pod IPs (best performance on EKS)
    alb.ingress.kubernetes.io/target-type: ip
    # CRITICAL: Grouping ensures ONE ALB handles all services to save costs
    alb.ingress.kubernetes.io/group.name: aabhar-group
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    
    # --- Health Checks (Vital for 200 OK status) ---
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/success-codes: '200-399'
    alb.ingress.kubernetes.io/healthcheck-path: /
    
    # --- Performance Settings ---
    # Matches your local 300s timeout requirement
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=300
spec:
  ingressClassName: alb
  rules:
  - host: api.aabhar.top
    http:
      paths:
      # --- Microservices (Specific paths first) ---
      - path: /v1/auth
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 8001
      - path: /v1/roles
        pathType: Prefix
        backend:
          service:
            name: roles-service
            port:
              number: 8002
      - path: /v1/employees
        pathType: Prefix
        backend:
          service:
            name: employees-service
            port:
              number: 8003
      - path: /v1/wallets
        pathType: Prefix
        backend:
          service:
            name: wallet-service
            port:
              number: 8004
      - path: /v1/recognitions
        pathType: Prefix
        backend:
          service:
            name: recognition-service
            port:
              number: 8005
      - path: /v1/rewards
        pathType: Prefix
        backend:
          service:
            name: rewards-service
            port:
              number: 8006
      - path: /v1/organizations
        pathType: Prefix
        backend:
          service:
            name: organization-service
            port:
              number: 8007
      - path: /v1/analytics
        pathType: Prefix
        backend:
          service:
            name: analytics-service
            port:
              number: 8008
      # --- Catch-all Fallback (Dashboard) ---
      - path: /
        pathType: Prefix
        backend:
          service:
            name: skooner
            port:
              number: 80