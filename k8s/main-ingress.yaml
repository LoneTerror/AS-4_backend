apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rnr-master-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    # Disable the default CORS annotation as we are handling it manually in the snippet
    nginx.ingress.kubernetes.io/enable-cors: "false" 
    
    nginx.ingress.kubernetes.io/configuration-snippet: |
      # 1. Check if the origin is allowed
      set $cors_origin "";
      if ($http_origin ~* (http://api.rnr.local|http://localhost:3000)) {
          set $cors_origin $http_origin;
      }

      # 2. Handle the Preflight (OPTIONS)
      if ($request_method = 'OPTIONS') {
          add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
          add_header 'Access-Control-Allow-Credentials' 'true' always;
          add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
          add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization,X-Request-ID' always;
          add_header 'Access-Control-Max-Age' 1728000;
          add_header 'Content-Type' 'text/plain charset=UTF-8';
          add_header 'Content-Length' 0;
          return 204;
      }

      # 3. Add headers for the actual requests (GET, POST, etc.)
      add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
      add_header 'Access-Control-Allow-Credentials' 'true' always;
      add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
      add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization,X-Request-ID' always;
spec:
  ingressClassName: nginx
  rules:
  - host: api.rnr.local
    http:
      paths:
      - path: /v1/auth
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 8001

      - path: /v1/roles
        pathType: Prefix
        backend:
          service:
            name: roles-service
            port:
              number: 8002

      - path: /v1/employees
        pathType: Prefix
        backend:
          service:
            name: employees-service
            port:
              number: 8003
      - path: /v1/wallets
        pathType: Prefix
        backend:
          service:
            name: wallet-service
            port:
              number: 8004
      - path: /v1/recognitions
        pathType: Prefix
        backend:
          service:
            name: recognition-service
            port:
              number: 8005

      - path: /v1/rewards
        pathType: Prefix
        backend:
          service:
            name: rewards-service
            port:
              number: 8006

      - path: /v1/organizations
        pathType: Prefix
        backend:
          service:
            name: organization-service
            port:
              number: 8007

      - path: /v1/analytics
        pathType: Prefix
        backend:
          service:
            name: analytics-service
            port:
              number: 8008
      