apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: organization-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /v1/organization/$2
spec:
  ingressClassName: nginx
  rules:
  - host: api.rnr.local
    http:
      paths:
      - path: /organization(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: organization-service
            port:
              number: 8007