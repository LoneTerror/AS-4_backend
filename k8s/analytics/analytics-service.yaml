apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      terminationGracePeriodSeconds: 5
      imagePullSecrets:
      - name: regcred
      containers:
      - name: analytics-container
        image: mrmonster786/rnr-backend-base:latest 
        imagePullPolicy: Always
        # ── Added OTel Wrapper ────────────────────────────────────────────────
        args: [
          "opentelemetry-instrument", 
          "python", "-m", "uvicorn", 
          "src.analytics.main:app", 
          "--host", "0.0.0.0", 
          "--port", "8008"
        ]
        ports:
        - containerPort: 8008
        env:
        # ── Specific Service Name (Overrides the generic secret) ──────────────
        - name: OTEL_SERVICE_NAME
          value: "analytics-service"
        envFrom:
        - secretRef:
            name: rnr-secrets
        resources:
          requests:
            memory: "200Mi"  
            cpu: "100m"
          limits:
            memory: "512Mi"  
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
spec:
  selector:
    app: analytics-service
  ports:
    - protocol: TCP
      port: 8008
      targetPort: 8008