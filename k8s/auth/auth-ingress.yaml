apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth-ingress # Unique name per file
  namespace: default
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "http://api.rnr.local:30119"
    nginx.ingress.kubernetes.io/cors-allow-methods: "PUT, GET, POST, OPTIONS, DELETE"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"
    # Essential: This maps api.rnr.local/auth/docs -> auth-service:8001/v1/auth/docs
    nginx.ingress.kubernetes.io/rewrite-target: /v1/auth/$2
spec:
  ingressClassName: nginx
  rules:
  - host: api.rnr.local
    http:
      paths:
      - path: /v1/auth(/|$)(.*) # This captures the "anything" after /auth as group $2
        pathType: ImplementationSpecific
        backend:
          service:
            name: auth-service
            port:
              number: 8001