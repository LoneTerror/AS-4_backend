apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-container
        # [FIX] Ensure the image name matches your Docker Hub repo
        image: 192.168.116.51:30500/rnr-backend-base:latest 
        imagePullPolicy: Always
        # [FIX] This overrides the Dockerfile CMD to use the correct entry point
        args: ["python", "-m", "uvicorn", "src.auth.main:app", "--host", "0.0.0.0", "--port", "8001"]
        ports:
        - containerPort: 8001
        envFrom:
        - secretRef:
            name: rnr-secrets
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector:
    app: auth-service
  ports:
    - protocol: TCP
      port: 8001       # Port exposed by the Service
      targetPort: 8001 # Must match containerPort and Uvicorn port