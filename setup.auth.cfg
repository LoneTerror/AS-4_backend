[run]
source = src/auth
branch = True
omit =
    src/auth/tests/*
    src/auth/__init__.py
    src/auth/main.py
    src/prisma/*
    venv/*
    .venv/*

[report]
fail_under   = 80
show_missing = True
precision    = 2
exclude_lines =
    pragma: no cover
    def __repr__
    if TYPE_CHECKING:
    raise NotImplementedError
    \.\.\.

[html]
directory = htmlcov/auth
title = Auth Service — Coverage Report

[xml]
output = coverage-auth.xml