# Let Nginx automatically scale workers to the number of CPU cores
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /tmp/nginx-access.log;
    error_log  /tmp/nginx-error.log;

    # Security best practice: Hide Nginx version
    server_tokens off;

    # Apply global timeout settings to match Gunicorn
    proxy_read_timeout 120s;
    proxy_connect_timeout 120s;
    proxy_send_timeout 120s;

    server {
        listen 8000;

        # Standard security headers to pass dynamic scanning
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header X-XSS-Protection "1; mode=block";

        location /health {
            return 200 'OK';
        }

        # Shared proxy settings
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Service routing
        location /v1/auth {
            proxy_pass http://127.0.0.1:8001/v1/auth;
        }

        location /v1/roles/ {
            proxy_pass http://127.0.0.1:8002/v1/roles/;
        }

        location /v1/employees/ {
            proxy_pass http://127.0.0.1:8003/v1/employees/;
        }

        location /v1/wallet/ {
            proxy_pass http://127.0.0.1:8004/v1/wallet/;
        }

        location /v1/recognition/ {
            proxy_pass http://127.0.0.1:8005/v1/recognition/;
        }

        location /v1/rewards {
            proxy_pass http://127.0.0.1:8006/v1/rewards;
        }

        location /v1/org/ {
            proxy_pass http://127.0.0.1:8007/v1/org/;
        }

        location /v1/dashboard/ {
            proxy_pass http://127.0.0.1:8008/v1/dashboard/;
        }
    }
}