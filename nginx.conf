http {

    log_format service_log 
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" '
        'service=$service_name';

    map $uri $service_name {
        ~^/([^/]+)/  $1;
        default      unknown;
    }

    server {
        listen 8000;

        location /health {
            return 200 'OK';
        }

        location ~ ^/([^/]+)/(.+)$ {

            # Extract service name
            set $service $1;

            # Rewrite to hide version
            rewrite ^/(.*)$ /v1/$1 break;

            # Dynamic port mapping
            proxy_pass http://localhost:${service_port};
        }
    }

    # Map service to port
    map $service_name $service_port {
        auth          8001;
        employees     8003;
        wallet        8004;
        recognition   8005;
        rewards       8006;
        org           8007;
        default       8001;
    }
}