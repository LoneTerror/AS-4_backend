# Global settings for non-root execution
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Redirect temp folders to /tmp where appuser has permissions
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log to /tmp as verified in previous steps
    access_log /tmp/nginx-access.log;
    error_log  /tmp/nginx-error.log;

    server {
        listen 8000;

        location /health {
            return 200 'OK';
        }

        # Shared proxy settings to keep it clean
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Service routing - Updated from localhost to 127.0.0.1
        location /auth/ {
            proxy_pass http://127.0.0.1:8001/;
        }

        location /employees/ {
            proxy_pass http://127.0.0.1:8003/;
        }

        location /wallet/ {
            proxy_pass http://127.0.0.1:8004/;
        }

        location /recognition/ {
            proxy_pass http://127.0.0.1:8005/;
        }

        location /rewards/ {
            proxy_pass http://127.0.0.1:8006/;
        }

        location /org/ {
            proxy_pass http://127.0.0.1:8007/;
        }
    }
}