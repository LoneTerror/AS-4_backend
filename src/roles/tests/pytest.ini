[pytest]
asyncio_mode = auto
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --cov=src/roles
    --cov-report=html:src/roles/tests/htmlcov
    --cov-report=term-missing
    --cov-fail-under=80

[coverage:run]
omit =
    */roles/main.py
    */roles/tests/*

[coverage:report]
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.:
    raise NotImplementedError
