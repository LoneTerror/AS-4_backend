[pytest]
asyncio_mode = auto
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --cov=src/recognition
    --cov=src/common
    --cov-report=html:src/recognition/tests/htmlcov
    --cov-report=term-missing
    --cov-fail-under=80

[coverage:run]
omit =
    */main.py

[coverage:report]
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.:
    raise NotImplementedError