[run]
source = src/organization
branch = True
omit =
    src/organization/tests/*
    src/organization/__init__.py
    src/organization/main.py
    src/prisma/*
    venv/*
    .venv/*

[report]
fail_under   = 80
show_missing = True
precision    = 2
exclude_lines =
    pragma: no cover
    def __repr__
    if TYPE_CHECKING:
    raise NotImplementedError
    \.\.\.

[html]
directory = htmlcov/organization
title = Organization Service — Coverage Report

[xml]
output = coverage-organization.xml